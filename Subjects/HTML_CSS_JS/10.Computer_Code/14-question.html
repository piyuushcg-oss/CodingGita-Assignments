<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Code Elements</title>

    <style>
        kbd {
            background: #f2f2f2;
            border: 1px solid #888;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: monospace;
        }

        pre {
            background: #1e1e1e;
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <p>Press <kbd>Ctrl + S</kbd> to save the document.</p>

    <pre>
def greet(name):
    print("Hello,", name)

greet("Piyush")
    </pre>

</body>
</html>
