<!DOCTYPE html>
<html>
<head>
    <title>Complete Course Table</title>
</head>
<body>

    <table border="1">
        <caption>Course Information</caption>

        <thead>
            <tr>
                <th scope="col">Course</th>
                <th scope="col">Duration</th>
                <th scope="col">Mode</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="row">Web Development</th>
                <td>4 Months</td>
                <td>Online</td>
            </tr>

            <tr>
                <th scope="row">Data Analytics</th>
                <td colspan="2">5 Months - Online</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">End of Course Information</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
