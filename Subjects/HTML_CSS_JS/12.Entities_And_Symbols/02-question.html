<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price List</title>
</head>
<body>

<p>Euro using named entity: &euro;50</p>

<p>Euro using hexadecimal entity: &#x20AC;50</p>

<p>Pound using named entity: &pound;40</p>

<p>Pound using decimal entity: &#163;40</p>

<p>Yen using hexadecimal entity: &#x00A5;5000</p>

</body>
</html>
