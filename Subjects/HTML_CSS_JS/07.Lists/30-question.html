<!DOCTYPE html>
<html>
<head>
    <title>Complete List Example</title>
</head>
<body>

    <h2>Programming Languages</h2>

    <ul type="square">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>Project Steps</h2>

    <ol type="A" start="3" reversed>
        <li>Planning</li>
        <li>Development</li>
        <li>Testing</li>
    </ol>

    <h2>Technical Terms</h2>

    <dl>
        <dt>HTML</dt>
        <dd>Language used to create webpage structure.</dd>

        <dt>CSS</dt>
        <dd>Language used to style webpages.</dd>
    </dl>

    <h2>Web Development</h2>

    <ul>
        <li>Frontend
            <ol>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ol>
        </li>
    </ul>

</body>
</html>
