<!DOCTYPE html>
<html>
<head>
    <title>HTML List Types</title>
</head>
<body>

    <dl>

        <dt>Unordered List</dt>
        <dd>Displays list items using bullets without a specific order.</dd>

        <dt>Ordered List</dt>
        <dd>Displays list items using numbers, letters, or Roman numerals.</dd>

        <dt>Description List</dt>
        <dd>Displays terms along with their descriptions.</dd>

    </dl>

</body>
</html>
