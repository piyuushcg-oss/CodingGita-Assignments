<!DOCTYPE html>
<html>
<head>
    <title>Advanced List Example</title>
</head>
<body>

    <ol type="I">

        <li>Frontend Development

            <ul type="square">
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>

        </li>

        <li>Programming Concepts

            <dl>
                <dt>Algorithm</dt>
                <dd>A step-by-step procedure used to solve a problem.</dd>

                <dt>Variable</dt>
                <dd>A named storage location used to hold data.</dd>
            </dl>

        </li>

        <li>Project Development

            <ol type="a" start="3">
                <li>Planning</li>
                <li>Coding</li>
                <li>Testing</li>
            </ol>

        </li>

    </ol>

</body>
</html>
