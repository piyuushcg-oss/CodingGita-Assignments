<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Override Attributes</title>
</head>
<body>

<h1>Form Override Attributes</h1>

<form
    action="/default.php"
    method="post"
    target="_self">

    <label for="name">Name:</label>
    <input
        type="text"
        id="name"
        name="name"
        required>

    <br><br>

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        required>

    <br><br>

    <!-- Default action, method, and target -->
    <button type="submit">
        Default Submit
    </button>

    <!-- Overrides action -->
    <button
        type="submit"
        formaction="/special.php">
        Override Action
    </button>

    <!-- Overrides method -->
    <button
        type="submit"
        formmethod="get">
        Override Method
    </button>

    <!-- Overrides validation and target -->
    <button
        type="submit"
        formnovalidate
        formtarget="_blank">
        Save Draft / New Tab
    </button>

</form>

</body>
</html>
