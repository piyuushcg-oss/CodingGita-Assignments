<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Loading Image</title>
</head>
<body>

    <h1>My Image</h1>

    <img src="MyProject/Assets/banner.png"
         alt="A beautiful photo"
         loading="auto"
         width="500"
         height="300">

    <p>The browser will decide automatically when to load the image.</p>

</body>
</html>
