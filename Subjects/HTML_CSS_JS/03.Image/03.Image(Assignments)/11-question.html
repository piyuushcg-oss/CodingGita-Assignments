<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Image Tag</title>
</head>
<body>

    <h1>My Responsive Image</h1>

    <img src="MyProject/flower.jpg.jpg"
         alt="Beautiful nature view"
         width="600"
         height="400"
         loading="lazy"
         title="Click to view full size"
         srcset="images/photo-small.jpg 400w,
                 images/photo-large.jpg 800w">

</body>
</html>
