<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link and Iframe</title>
</head>
<body>

    <a href="https://www.example.com" target="exampleFrame">
        Open Example Site
    </a>

    <br><br>

    <iframe
        name="exampleFrame"
        width="100%"
        height="300"
        title="Example Site Frame"
        style="border: none;">
    </iframe>

</body>
</html>
