<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Permissions</title>
</head>
<body>

    <iframe
        src="https://www.example.com"
        width="800"
        height="450"
        allow="fullscreen; gyroscope; usb"
        title="Iframe With Fullscreen Gyroscope and USB"
        style="border: none;">
    </iframe>

</body>
</html>
