<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen USB Iframe</title>
</head>
<body>

    <iframe
        src="https://www.example.com"
        width="700px"
        height="450px"
        allow="fullscreen; usb"
        title="Fullscreen and USB Content"
        style="border: none;">
    </iframe>

</body>
</html>
