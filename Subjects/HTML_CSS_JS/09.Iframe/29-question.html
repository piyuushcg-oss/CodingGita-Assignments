<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Comparison</title>

    <style>
        .container {
            display: flex;
            gap: 20px;
        }

        iframe {
            width: 48%;
            height: 350px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">

        <iframe
            src="https://www.example.com"
            allow="fullscreen"
            title="Version A - Fullscreen Only">
        </iframe>

        <iframe
            src="https://www.example.com"
            allow="fullscreen; gyroscope; usb"
            title="Version B - Fullscreen Gyroscope and USB">
        </iframe>

    </div>

</body>
</html>
