<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Navigation</title>
</head>
<body>

    <nav>
        <a href="https://www.example.com" target="siteFrame">
            Example
        </a>

        <a href="https://www.wikipedia.org" target="siteFrame">
            Wikipedia
        </a>

        <a href="https://www.w3.org" target="siteFrame">
            W3C
        </a>
    </nav>

    <br>

    <iframe
        name="siteFrame"
        width="100%"
        height="400"
        title="Navigation Website Frame"
        style="border: none;">
    </iframe>

</body>
</html>
