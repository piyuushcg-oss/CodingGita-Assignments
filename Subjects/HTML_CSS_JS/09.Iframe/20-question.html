<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Gyroscope Iframe</title>

    <style>
        .styled-iframe {
            width: 100%;
            height: 420px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <iframe
        class="styled-iframe"
        src="https://www.example.com"
        allow="gyroscope"
        title="Styled Gyroscope Website">
    </iframe>

</body>
</html>
