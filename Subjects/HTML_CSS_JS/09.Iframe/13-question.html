<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Aspect Ratio Iframe</title>

    <style>
        .iframe-container {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe
            src="https://www.example.com"
            title="Responsive Website">
        </iframe>
    </div>

</body>
</html>
