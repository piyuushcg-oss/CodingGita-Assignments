<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Permission Comparison</title>

    <style>
        iframe {
            width: 100%;
            height: 300px;
            border: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h2>Iframe With Fullscreen Permission</h2>

    <iframe
        src="https://www.example.com"
        allow="fullscreen"
        title="Iframe With Fullscreen Permission">
    </iframe>

    <h2>Iframe Without Allow Attribute</h2>

    <iframe
        src="https://www.example.com"
        title="Iframe Without Special Permissions">
    </iframe>

</body>
</html>
