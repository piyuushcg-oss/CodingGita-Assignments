<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Permission Frames</title>

    <style>
        .frame {
            width: 48%;
            height: 350px;
            border: none;
        }
    </style>
</head>
<body>

    <iframe
        class="frame"
        src="https://www.example.com"
        allow="fullscreen"
        title="Fullscreen Frame">
    </iframe>

    <iframe
        class="frame"
        src="https://www.example.com"
        allow="gyroscope"
        title="Gyroscope Frame">
    </iframe>

</body>
</html>
