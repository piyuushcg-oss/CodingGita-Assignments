<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Iframe</title>

    <style>
        .responsive-iframe {
            width: 100%;
            height: 400px;
            border: none;
            margin: 10px;
        }
    </style>
</head>
<body>

    <iframe
        class="responsive-iframe"
        src="https://www.example.com"
        title="Responsive Example Website">
    </iframe>

</body>
</html>
