<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB Device Loader</title>

    <style>
        .button {
            display: inline-block;
            padding: 10px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <a
        href="https://device.example.com"
        target="myDeviceFrame"
        class="button">
        Open Device Control
    </a>

    <iframe
        name="myDeviceFrame"
        allow="usb"
        title="USB Device Control Frame">
    </iframe>

</body>
</html>
