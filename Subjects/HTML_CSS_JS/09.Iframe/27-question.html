<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Navigation</title>
</head>
<body>

    <ul>
        <li>
            <a href="https://www.example.com" target="mainFrame">
                Example
            </a>
        </li>

        <li>
            <a href="https://www.wikipedia.org" target="mainFrame">
                Wikipedia
            </a>
        </li>

        <li>
            <a href="https://www.w3.org" target="mainFrame">
                W3C
            </a>
        </li>
    </ul>

    <iframe
        name="mainFrame"
        src="https://www.example.com"
        width="100%"
        height="400"
        allow="fullscreen"
        title="Main Navigation Frame"
        style="border: none;">
    </iframe>

</body>
</html>
