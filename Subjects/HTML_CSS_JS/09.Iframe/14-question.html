<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Example</title>
</head>
<body>

    <h1>Iframe Permissions</h1>

    <p>
        This page demonstrates different iframe permissions.
    </p>

    <iframe
        src="https://device.example.com"
        width="600"
        height="300"
        allow="usb"
        title="USB Device Frame"
        style="border: none;">
    </iframe>

    <br><br>

    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="560"
        height="315"
        allow="fullscreen"
        title="Fullscreen Video Frame"
        style="border: none;">
    </iframe>

</body>
</html>
