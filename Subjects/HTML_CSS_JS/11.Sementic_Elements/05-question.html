<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
</head>
<body>

<main>
    <article>
        <h1>Smartphone X</h1>

        <p>
            Smartphone X is a modern smartphone with a powerful processor,
            high-quality camera, and long-lasting battery.
        </p>

        <figure>
            <img src="https://via.placeholder.com/400x250" alt="Smartphone X">
            <figcaption>Smartphone X - Modern and Powerful</figcaption>
        </figure>

        <details>
            <summary>Technical Specifications</summary>
            <p>Processor: Octa-Core</p>
            <p>RAM: 8 GB</p>
            <p>Storage: 128 GB</p>
            <p>Battery: 5000 mAh</p>
        </details>
    </article>

    <aside>
        <h2>Seller Information</h2>
        <p>Seller: Tech Store</p>
        <p>Email: seller@example.com</p>
    </aside>
</main>

</body>
</html>
